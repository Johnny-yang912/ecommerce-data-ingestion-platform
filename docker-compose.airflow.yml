# Airflow overlay —— 與 docker-compose.yml 疊加使用：
#
#   docker compose -f docker-compose.yml -f docker-compose.airflow.yml up --build
#
# 為什麼是獨立檔而不是併進 docker-compose.yml：只想跑 API 的人不必拉起四個 Airflow
# 容器。疊加成同一個 compose project 讓兩邊共用預設網路，DAG 才能以 `db` 這個
# hostname 連到業務資料庫。
#
# 【必要前置】.env 需有 BQ_PROJECT、GCP_SA_KEY_PATH——後者是金鑰【檔案】的主機路徑，
# 會被單檔唯讀掛到容器內的固定位置（見下方 volumes）。
# 建議一併設 AIRFLOW_UID=$(id -u)，否則容器以 uid 50000 寫入 bind mount，
# 主機端會清不掉 dbt 產生的 target/ 與 logs/。

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: orchestration/Dockerfile
  # ⭐ 排程器必須活得比它排的工作久——這是整個排程化的前提，不是便利設定。
  #    主機重開之後 api/worker/beat 會自己回來（docker-compose.yml 也設了同樣的
  #    policy），排程器若沒回來，結果是「服務都在、但什麼都不會跑」——**而且沒有
  #    任何紅燈**，因為沒有 DAG run 被建立，也就沒有失敗可看。
  #    ⚠️ 一次性服務（airflow-init）必須顯式覆寫回 "no"，否則它會跑完就重啟、無限循環。
  restart: unless-stopped
  # uid 對齊主機使用者：容器要寫 bind mount 內的 dbt target/ 與 logs/。
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    # 各元件必須共用同一個 jwt_secret，否則彼此呼叫會認證失敗。
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-dev-only-change-me}
    # LocalExecutor 的 task 透過 Execution API 回報狀態；scheduler 與 api-server
    # 不同容器，故不能用預設的 localhost。
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # 本機練習用：免登入。正式環境請換掉 auth manager。
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

    # 放寬 DAG 解析逾時，容忍宿主機時鐘偏移造成 dag-processor 誤殺解析子行程
    # （WSL2 kernel 的時鐘問題，屬開發者個人環境；一般部署不會遇到，可維持預設 50）。
    # 代價：真正卡住的解析改為 1 小時後才被砍掉重試，而非預設的 50 秒。
    AIRFLOW__DAG_PROCESSOR__DAG_FILE_PROCESSOR_TIMEOUT: "3600"

    # ── 交給 task 的專案設定（BashOperator 會繼承）──────────────────────────
    # 指向同一個 compose project 裡的 db 服務（來自 docker-compose.yml）。
    # ⚠️ 這個值必須與下方 SEED_API_URL 指向【同一套系統】——灌進 A 庫、抽 B 庫的話，
    #    DAG 會全綠、ODS 零增長、freshness 照樣紅，而且沒有任何錯誤訊息。
    #    兩者同在一個 compose 網路，就是為了讓這件事不可能發生。
    DB_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-orders}
    # ⚠️ 必須與 worker / beat 讀到同一個值（docker-compose.yml 也有這行）。
    #    raw_pending_watch 的門檻是【從這個值推導】出來的（見 check_raw_pending.py ③）：
    #    只調了那一邊的話，恢復掃描變慢而探針門檻不變 → 探針開始對「正在被正確
    #    處理的列」誤報，而且沒有任何地方會提示這兩者已經分岔。
    SCAN_INTERVAL_SECONDS: ${SCAN_INTERVAL_SECONDS:-300}
    BQ_PROJECT: ${BQ_PROJECT}
    BQ_DBT_DATASET: ${BQ_DBT_DATASET:-dbt_dev}
    # ── seeding（Phase 5+：持續攝入）─────────────────────────────────────────
    # seed_demo.py 走真實的 POST /orders，所以 Airflow 需要一把 API 金鑰。
    # 建議在 API_KEYS 另開一組 seeding 專用身分（例如 demo_seed_key:demo-seeder）：
    # 限流是 per client_id，demo 流量才不會吃掉上游真實流量的配額；附帶讓
    # ODS.source_client_id 能區分「demo 資料」與「真實上游」——這在 freshness
    # 恢復為 gate 之後特別重要，否則分不出「有資料」是真有上游還是自己餵自己。
    API_KEYS: ${API_KEYS}
    # 預設指向同一個 compose project 裡的 api 服務。
    # ⚠️ 這個位址與上面的 DB_URL 必須指向【同一套系統】——灌進 A 庫、抽 B 庫的話，
    #    DAG 會全綠、ODS 零增長、freshness 照樣紅，而且沒有任何錯誤訊息。
    SEED_API_URL: ${SEED_API_URL:-http://api:8000/orders}
    # 容器內的金鑰路徑（bq.py 的 ADC setdefault 與 dbt profile 的 keyfile 都讀它）。
    # 這是【容器內】的固定路徑，與主機上金鑰叫什麼名字無關——主機端那條是 .env 的
    # GCP_SA_KEY_PATH，兩者由下方 volumes 橋接。刻意分開命名的理由見 .env.example。
    GOOGLE_APPLICATION_CREDENTIALS: /opt/secrets/sa-key.json
    # dbt 讀版控中的 env_var 版 profile，你本機的 ~/.dbt/profiles.yml 不受影響。
    DBT_PROFILES_DIR: /opt/project/orchestration/dbt_profiles
    LOG_FORMAT: json
    # 失敗通知的通道（見 orchestration/dags/_notify.py）。刻意【不】用 `${...:?}`
    # 守衛——對照 otel-collector 的 GRAFANA_OTLP_*，那兩個缺值就必然 401，起來也沒用；
    # 這裡「沒設定」是合法狀態（通道退回 log），拿它擋住整組 Airflow 啟動是過度反應。
    NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
    NOTIFY_WEBHOOK_TIMEOUT_S: ${NOTIFY_WEBHOOK_TIMEOUT_S:-3}
  volumes:
    - ./orchestration/dags:/opt/airflow/dags:ro
    # ⚠️ 專案原始碼在此是 bind mount，而 api/worker/beat 是【烤進映像】的。
    #    改 clean.py 之類的共用模組時，這一邊立刻生效、那一邊要 build——
    #    規則版本會因此無聲分歧，見 docs/zh-TW/runbooks/proposal-b-rollout.md 第 3 步。
    #
    # ⭐ 專案根【唯讀】，只對真正要寫的路徑逐一開 rw。
    #    這條之前是 `:rw`，而 ./orchestration/dags 是 ./ 的子目錄——同一批主機檔案
    #    因此有兩條容器路徑、兩種權限，上面那行的 `:ro` 形同虛設（現場證據：
    #    orchestration/dags/__pycache__/ 底下有一批 gid=0、cpython-312 的 .pyc，
    #    是容器經由 /opt/project/... 那條路寫進去的）。重疊掛載 Docker 不會警告，
    #    Python 寫不了 __pycache__ 也是靜默降級——失效時沒有任何訊號。
    #    容器實際的寫入需求只有下面三個 dbt 產出目錄（都已 gitignore）。
    - ./:/opt/project:ro
    # ⚠️ 巢狀掛載：目標路徑較深者後掛，故這三條會正確覆蓋在上面的 :ro 之上。
    #    ⭐ 來源目錄【必須先存在於主機】。不存在時 Docker 會替你以 root 建目錄，
    #      主機端反而清不掉——比忘了掛還難處理。
    - ./ecommerce_dbt/target:/opt/project/ecommerce_dbt/target:rw
    - ./ecommerce_dbt/logs:/opt/project/ecommerce_dbt/logs:rw
    - ./ecommerce_dbt/dbt_packages:/opt/project/ecommerce_dbt/dbt_packages:rw
    # ⭐ 用空檔遮住主機的 .env。這把一條【只存在於註解裡的約定】變成結構保證：
    #    raw_pending_watch / seed_demo_daily 都寫著「不 cd 進 /opt/project，否則
    #    load_dotenv 會讀到主機的 .env，那裡的 DB_URL 在容器內是錯的」——那個故障
    #    的樣子正是本檔 DB_URL 註解警告的「DAG 全綠、ODS 零增長、零錯誤訊息」。
    #    遮掉之後，就算有人 cd 過去，config 的 env_file 也只會讀到空檔而純吃容器
    #    環境變數（compose 已注入全部所需的鍵）。附帶把 API_KEYS 等祕密移出容器視野。
    #    用 /dev/null 而不是 repo 裡的空檔：不必為了掛載而在版控中多一個檔案。
    - /dev/null:/opt/project/.env:ro
    # 金鑰單檔唯讀掛到固定路徑。左側由 compose 在【主機】上替換，右側是【容器內】路徑。
    # ⭐ 來源檔不存在時，容器會在 create 階段就 exit 127——這是刻意選的失敗方式。
    # ⚠️ 用 GCP_SA_KEY_PATH 而非 GOOGLE_APPLICATION_CREDENTIALS 當來源是刻意的：
    #    後者是 Google SDK 的標準名，任何 shell / 工具都可能 export 它，而 compose
    #    的 ${...} 替換是【shell 環境優先於 .env】——拿它當掛載來源等於把基礎設施的
    #    輸入交給一個公共命名空間，且被蓋掉時 compose 不會有任何提示。
    - ${GCP_SA_KEY_PATH:?請在 .env 設定金鑰檔的主機路徑}:/opt/secrets/sa-key.json:ro
    - airflow-logs:/opt/airflow/logs
  # 目前沒有任何設定指向主機（DB 與 API 都在 compose 網路內）。保留這條是為了讓
  # 「臨時要連主機上的某個服務」不必改 compose 檔；Linux 上沒有這個名字，需要
  # host-gateway 才解析得到，Docker Desktop 本來就有，加了也無害。
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    airflow-db:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  # Airflow 的 metadata 刻意【不】與業務 DB 共用實例：業務 DB 是資料錨點
  # （Proposal C「從 Raw 重建」的前提），不該讓一個運維元件的歷史與它綁在同一次
  # 備份／還原裡。多一個容器換故障域與備份語意的清爽。
  airflow-db:
    image: postgres:16
    # 它不套 x-airflow-common（不同映像），restart policy 因此要自己寫一次。
    # 少了這行，重開機後三個 Airflow 服務會起來卻連不到 metadata DB。
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 一次性：建 schema。跑完即退出，其餘服務等它成功（同 docker-compose.yml 的 migrate 手法）。
  airflow-init:
    <<: *airflow-common
    command: db migrate
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      # ⚠️ 綁在 loopback 而非 0.0.0.0：上面的 SIMPLE_AUTH_MANAGER_ALL_ADMINS=true
      #    表示【任何連得到這個埠的人都是 Airflow admin】——admin 能觸發 DAG、讀
      #    task log（裡面有連線字串）、看 Connections。免登入本身是刻意的本機選擇，
      #    但它與「發布到所有介面」疊在一起才構成暴露面。同 otel-collector 只發布
      #    health 埠的判準：只有需要連的人連得到。
      #    WSL2 下從 Windows 瀏覽器連 localhost:8080 仍然通（走 loopback 轉發）。
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  # Airflow 3 把 DAG 解析拆成獨立行程。這正是「DAG 檔不得 top-level import 專案模組」
  # 更加重要的原因：解析行程的環境與 task 執行環境是分開的。
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor

  # 刻意不起 triggerer：本 DAG 只用 BashOperator，沒有 deferrable operator。
  # 日後若引入 sensor 的 deferrable 模式再補。

volumes:
  airflow-pgdata:
  airflow-logs:
