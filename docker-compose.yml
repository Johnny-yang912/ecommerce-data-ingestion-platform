# api / worker / beat 三個服務的遙測設定完全相同（服務名由程式碼傳入，不走環境變數，
# 見 telemetry.py），故抽成 anchor——與 docker-compose.airflow.yml 的 x-airflow-common
# 同一個做法。三份手抄最容易出現的錯是「只改了兩份」，而遙測設定漂掉是靜默的。
x-otel-env: &otel-env
  OTEL_ENABLED: "true"
  # ⚠️ 標準名在此指向【本機 Collector】，不是 Grafana Cloud。雲端 endpoint 與憑證
  #    只有 otel-collector 服務看得到（.env 裡叫 GRAFANA_OTLP_*），這樣 app 就算
  #    設定寫錯也不可能直連雲端。
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dev
  # 取樣率。現在是 seed_demo 每天 800 筆，全量送遠低於免費額度（50GB traces）。
  # ⚠️ 跑 load_test.py 之前務必先調低 ARG——那支腳本的量級與日常流量差好幾個數量級，
  #    一次壓測就可能吃掉可觀的額度，而超額不會有錯誤訊息。
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "1.0"
  # --- Metrics（B1）。以下三個都是「現在的預設值」，但全部明確釘死 ---
  # ⚠️ ASGI instrumentation 會依這個變數決定要不要【同時】送新舊兩套 duration
  #    histogram。不釘死的話，某次依賴升級就會讓序列數無聲翻倍——沒有錯誤訊息，
  #    只有帳單或截流。空字串 = 只送舊版（目前的預設）。
  OTEL_SEMCONV_STABILITY_OPT_IN: ""
  # Prometheus / Mimir 吃的是累積型。目前就是預設，但這是會隨版本漂的預設。
  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: cumulative
  # 匯出間隔。縮短會等比增加資料點數與成本，而這些指標沒有一個需要秒級解析度。
  OTEL_METRIC_EXPORT_INTERVAL: "60000"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-orders}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-orders}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # ⚠️ 對外埠預設 5433 而非 5432：主機上若已有 postgres 佔著 5432，這個服務會
      #    直接起不來（bind: address already in use）。容器之間走 compose 網路的
      #    `db:5432`，完全不經過這個映射——它純粹是給主機端 psql 除錯用的。
      - "${DB_PUBLISH_PORT:-5433}:5432"

  # 攝入路徑的 Celery broker。刻意與 Airflow 分開（Airflow 目前是 LocalExecutor、
  # 根本沒有 broker），兩者的故障域不該糾纏——見 docs/zh-TW/design/orchestration.md〈範圍與職責邊界〉。
  #
  # 不開 appendonly：Redis 預設只有 RDB 快照，crash 可能丟掉最後幾秒的訊息。這裡刻意
  # 不用 fsync 換那個保證，因為 process.scan_and_recover 已經是資料庫層的兜底——丟訊息
  # 的後果只是「該筆延遲到下一輪掃描才處理」，而不是遺失。
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"   # 本機除錯用，正式可移除

  # 遙測的唯一出口。設定與理由見 otel/collector-config.yaml。
  #
  # ⚠️ 放在主 compose 而非獨立 overlay（對照 airflow 是 overlay）：Airflow 是可選的，
  #    Collector 不是——它是 api / worker / beat 的固定下游。做成 overlay 的話，
  #    忘了帶 -f 的後果不是「沒有遙測」，而是三個服務對著不存在的 host 持續重試、
  #    把日誌刷滿，而遙測仍然是靜默丟失的。
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      # ${...:?} 守衛：缺值時 compose 在解析階段就報錯，不會起一個必然 401 的
      # collector（同 airflow overlay 對 GCP_SA_KEY_PATH 的處理）。
      GRAFANA_OTLP_ENDPOINT: ${GRAFANA_OTLP_ENDPOINT:?請在 .env 設定，見 .env.example}
      GRAFANA_OTLP_AUTH: ${GRAFANA_OTLP_AUTH:?請在 .env 設定，見 .env.example}
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # 只發布 health_check 端點給主機除錯用（curl http://localhost:13133/）。
      # OTLP 的 4317/4318 不發布：只有同網路的容器需要連，發布出去只是擴大暴露面。
      - "${OTEL_HEALTH_PUBLISH_PORT:-13133}:13133"
    # ⚠️ 沒有 healthcheck 是刻意的，不是漏寫：這個映像裡沒有 shell 也沒有 curl/wget，
    #    容器內跑不了任何探測指令。存活要從主機端 curl 13133，或直接看 Grafana 有沒有
    #    資料——而後者本來就是雲端 absent 告警要回答的問題。
    restart: unless-stopped

  # 一次性 migration 服務：跑完即退出，api 等它成功才起
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DB_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-orders}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    # Dockerfile 的 CMD 是 exec form，${VAR} 不會展開 → worker 數在此覆寫。
    # 多行程之所以可行，是因為恢復掃描已搬到 Beat、API 行程不再持有背景狀態。
    command: >
      uvicorn main:app --host 0.0.0.0 --port 8000
      --workers ${UVICORN_WORKERS:-4}
    environment:
      <<: *otel-env
      DB_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-orders}
      API_KEYS: ${API_KEYS}
      LOG_FORMAT: json
      CELERY_BROKER_URL: redis://redis:6379/0
      # 限流計數器走 Redis db 1（broker 是 db 0）。沒有這行，4 個 worker
      # 各記各的，60/minute 會變成 240/minute。
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI-redis://redis:6379/1}
      # 連線預算：多行程之後 pool 是「每行程一份」。4 × (3+5) = 32，
      # 加上 worker 的 4 × (2+2) = 16，共 48，安全低於 Postgres 預設 max_connections=100。
      # 不改 config.py 的預設值（5/10）——那是單行程本機開發的合理值，
      # 這裡是部署形態帶來的差異，屬於環境設定。
      POOL_SIZE: 3
      MAX_OVERFLOW: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # 只要求 started、不要求 healthy：遙測**絕不能**成為 app 的啟動門檻。
      # 這裡的相依只為了排序（避免啟動瞬間對著不存在的 host 刷連線錯誤）。
      otel-collector:
        condition: service_started
    ports:
      - "8000:8000"
    # ⭐ 排程化之後這不再只是「方便」：seed_demo_daily 每天在台北 10/13/17/21 觸發、
    #    orders_analytics_daily 在台北 22:30 觸發，那些時間
    #    點不會有人盯著終端機。一個【排程作業的依賴，不該比排程器本身短命】——
    #    Airflow scheduler 是常駐 compose 服務，api / worker / beat 就必須同壽命。
    #    這也是 Phase 5 之後不再用「主機終端機跑 uvicorn」的根本理由。
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Celery worker：實際執行 process_raw_event 的地方。與 api 共用同一個映像，
  # 只換啟動指令——依賴與程式碼完全一致，不會出現「API 有這個 module、worker 沒有」。
  worker:
    build: .
    command: celery -A celery_app worker --loglevel=INFO --concurrency=4
    environment:
      <<: *otel-env
      DB_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-orders}
      LOG_FORMAT: json
      CELERY_BROKER_URL: redis://redis:6379/0
      SCAN_INTERVAL_SECONDS: ${SCAN_INTERVAL_SECONDS:-300}
      # prefork 下每個子行程有自己的 pool，同時又只跑一個任務 → pool 開大沒有意義。
      # 4 × (2+2) = 16，與 api 的 32 相加為 48，留足餘裕給 Airflow 與人工連線。
      POOL_SIZE: 2
      MAX_OVERFLOW: 2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # 只要求 started、不要求 healthy：遙測**絕不能**成為 app 的啟動門檻。
      # 這裡的相依只為了排序（避免啟動瞬間對著不存在的 host 刷連線錯誤）。
      otel-collector:
        condition: service_started
    restart: unless-stopped          # 同 api：排程作業的依賴不該比排程器短命
    healthcheck:
      # inspect ping 是廣播＋等回覆，比 HTTP 探針慢得多 → 間隔與 start_period 都放寬。
      test: ["CMD", "celery", "-A", "celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Celery Beat：週期恢復掃描的觸發者（取代原本掛在 FastAPI lifespan 的 asyncio 迴圈）。
  # 它只負責「按時送一則 tasks.scan_and_dispatch 訊息」，真正的掃描在 worker 執行，
  # 所以極輕——也因此可以放心單實例部署。
  #
  # ⚠️ 不可 `--scale beat=N`：多個 beat 會各自按時派掃描，變成重複掃描。後果無害
  #    （scan_and_recover 冪等、CAS claim 擋住重複處理），但純屬浪費。
  # ⚠️ 也不要改用 `celery worker -B` 的內嵌 beat：官方明示非生產用法。
  beat:
    build: .
    # schedule 檔寫到 /tmp 而非 /app：容器內的排程狀態是暫時的（間隔排程重啟後
    # 重新計時即可），沒必要污染程式碼目錄，也免去唯讀根檔案系統時的麻煩。
    command: celery -A celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    environment:
      <<: *otel-env
      DB_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-orders}
      LOG_FORMAT: json
      CELERY_BROKER_URL: redis://redis:6379/0
      SCAN_INTERVAL_SECONDS: ${SCAN_INTERVAL_SECONDS:-300}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # 只要求 started、不要求 healthy：遙測**絕不能**成為 app 的啟動門檻。
      # 這裡的相依只為了排序（避免啟動瞬間對著不存在的 host 刷連線錯誤）。
      otel-collector:
        condition: service_started
    # Beat 在手動灌資料時可以不起（broker 健康時每筆都派得出去），但排程化之後
    # 必須常駐：它是 broker 短暫抽風時 scan_and_dispatch 補派的唯一來源，而無人
    # 值守正是最需要那層兜底的場景。
    restart: unless-stopped

volumes:
  pgdata:
