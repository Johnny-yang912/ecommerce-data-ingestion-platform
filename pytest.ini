[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = . tests scripts
addopts = -v --cov=main --cov=process --cov=clean --cov=schema --cov=database --cov=logging_config --cov=models --cov=auth --cov=api_responses --cov=reevaluate_quality --cov=celery_app --cov=tasks --cov=circuit_breaker --cov=telemetry --cov-report=term-missing
# reevaluate_quality 納入覆蓋門檻，extract_ods_to_bq / seed_demo 則否——差別不是一致性，
# 是不可逆性：抽取寫錯重跑就好，但重評估寫的是 append-only 稽核表，寫錯刪不掉。
